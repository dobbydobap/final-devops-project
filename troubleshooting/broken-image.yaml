apiVersion: apps/v1
kind: Deployment
metadata: {name: studydesk-broken-image, namespace: studydesk}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      containers: [{name: backend, image: ghcr.io/example/studydesk-backend:does-not-exist}]
